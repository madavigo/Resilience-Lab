apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  imagePullPolicy: IfNotPresent
  configuration:
    # Talos doesn't expose /proc/PID/attr/current; empty string skips the
    # SELinux launcher type so virt-launcher pods don't carry an SELinux
    # context the host can't honor. Required for KubeVirt on Talos.
    selinuxLauncherType: ""
  workloads:
    nodePlacement:
      nodeSelector:
        node-role/storage: "true"
