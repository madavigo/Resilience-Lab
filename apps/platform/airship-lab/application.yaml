apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airship-lab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.madavigo.com/madavigo/Resilience-Lab.git
    targetRevision: main
    path: apps/platform/airship-lab/config
  destination:
    server: https://kubernetes.default.svc
    namespace: airship-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
