apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: airship-lab
  namespace: airship-lab
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: airship-lab
    spec:
      nodeSelector:
        node-role/storage: "true"
      # Don't co-schedule on a storage worker that's running media pods --
      # nzbget/lidarr/bazarr etc. are bursty and would fight the VM for CPU.
      # One-sided: the VM refuses to land on a node already running media
      # pods. (For the opposite direction -- media avoiding the VM's node --
      # we'd also need anti-affinity rules on each media Deployment.)
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: Exists
              namespaces: ["media"]
              topologyKey: kubernetes.io/hostname
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 24Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            cpu: "1"
            memory: 24Gi
          limits:
            cpu: "4"
            memory: 24Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: airship-lab-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: airship-lab-cloudinit
            networkDataSecretRef:
              name: airship-lab-cloudinit
