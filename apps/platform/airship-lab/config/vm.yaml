apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: airship-lab
  namespace: airship-lab
spec:
  running: true
  template:
    metadata:
      labels:
        kubevirt.io/vm: airship-lab
    spec:
      nodeSelector:
        node-role/storage: "true"
      # Prefer not to co-schedule on a storage worker that's running media
      # pods. Soft constraint (preferred, not required) so the homelab's
      # 4-core-per-node CPU ceiling doesn't strand the VM when d02/d03 are
      # busy. The media side has a matching preferred rule. Bidirectional
      # but best-effort.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: Exists
                namespaces: ["media"]
                topologyKey: kubernetes.io/hostname
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 1
        memory:
          guest: 24Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            # Storage workers run ~85% CPU-requested by other workloads; only
            # 430-620m free per node. Keep this request small so the VM can
            # actually schedule. limit stays at 4 cores so it can burst under
            # load -- burstable QoS is fine for a learning lab.
            cpu: "300m"
            memory: 24Gi
          limits:
            cpu: "4"
            memory: 24Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: airship-lab-rootdisk
        - name: cloudinit
          cloudInitNoCloud:
            secretRef:
              name: airship-lab-cloudinit
            networkDataSecretRef:
              name: airship-lab-cloudinit
