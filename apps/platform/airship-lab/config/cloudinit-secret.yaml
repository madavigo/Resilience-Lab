apiVersion: v1
kind: Secret
metadata:
  name: airship-lab-cloudinit
  namespace: airship-lab
type: Opaque
stringData:
  # Static network config for KubeVirt masquerade. The launcher pod's
  # internal bridge uses 10.0.2.0/24 with 10.0.2.1 as gateway; the guest
  # always lands at 10.0.2.2. Using static avoids any guest DHCP issue
  # (we hit a case where the guest never got a DHCP lease on Talos 1.9.6 /
  # KubeVirt 1.8.2, leaving cloud-init's network stage blocked).
  networkdata: |
    version: 2
    ethernets:
      enp1s0:
        addresses: [10.0.2.2/24]
        routes:
          - to: default
            via: 10.0.2.1
        nameservers:
          addresses: [1.1.1.1, 8.8.8.8]
  userdata: |
    #cloud-config
    users:
      - name: airship
        groups: [sudo, docker]
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        # Lab-only console password so virtctl console / serial login works
        # before SSH/network is up. Not a security concern in a private lab.
        lock_passwd: false
        plain_text_passwd: airship
        ssh_authorized_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDp7ZwTmqK2kSwWkspmxmiasjSTbidsIhEQtsxq9BBNF mattgolden@MacBookPro.madavigo.com"

    # Use chpasswd.list so the password is (re-)applied on every cloud-init
    # run, even when the airship user was already created on an earlier boot.
    # plain_text_passwd in users: only runs at user creation time.
    chpasswd:
      expire: false
      list: |
        airship:airship
    ssh_pwauth: true

    package_update: true
    package_upgrade: true

    # Files pre-written by cloud-init (before runcmd):
    #  - /etc/teleport.yaml: node agent config; ssh_service is immediate, the
    #    kubernetes_service points at /etc/teleport-kubeconfig which is a
    #    placeholder until the airshipctl flow populates it.
    #  - /etc/teleport-kubeconfig: placeholder kubeconfig (no clusters); replaced
    #    by /usr/local/bin/teleport-link-kubeconfig once `airshipctl document
    #    pull` + start-kind.sh + kubectl-merge-kubeconfig give us real contexts.
    #  - /usr/local/bin/teleport-link-kubeconfig: helper to copy the airship
    #    user's merged kubeconfig into Teleport's expected path and reload.
    write_files:
      - path: /etc/teleport.yaml
        owner: root:root
        permissions: '0644'
        content: |
          version: v3
          teleport:
            nodename: airship-lab
            proxy_server: teleport.madavigo.com:443
            auth_token: afa3cea9b385f16681d6dd7cb697eb9f
            data_dir: /var/lib/teleport
            log:
              output: stderr
              severity: INFO
          ssh_service:
            enabled: yes
            labels:
              env: lab
              role: airship
          kubernetes_service:
            enabled: yes
            kubeconfig_file: /etc/teleport-kubeconfig
            labels:
              env: lab
              role: airship
          proxy_service:
            enabled: no
          auth_service:
            enabled: no
      - path: /etc/teleport-kubeconfig
        owner: root:root
        permissions: '0640'
        content: |
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []
      - path: /usr/local/bin/teleport-link-kubeconfig
        owner: root:root
        permissions: '0755'
        content: |
          #!/usr/bin/env bash
          # Copy the airship user's merged kubeconfig (post-airshipctl-setup) to
          # the location Teleport's kubernetes_service reads, then reload the
          # agent. Re-run any time the kubeconfig changes (e.g. after
          # kubectl-merge-kubeconfig or clusterctl-move).
          set -e
          SRC="${1:-/home/airship/.airship/kubeconfig}"
          if [[ ! -s "$SRC" ]]; then
            echo "no kubeconfig at $SRC -- run airshipctl document pull + start-kind.sh first" >&2
            exit 1
          fi
          install -m 0640 -o root -g root "$SRC" /etc/teleport-kubeconfig
          systemctl restart teleport
          echo "teleport reloaded with $SRC"

    # bootcmd runs on EVERY boot (runcmd is once-per-instance, and KubeVirt
    # keeps the same cloud-init instance-id across VMI recreations because
    # it derives it from the VM's firmware UUID, not the VMI UID).
    bootcmd:
      - id airship && echo "airship:airship" | chpasswd && usermod -U airship || true

    runcmd:
      # Docker CE from Docker's official repo
      - install -m 0755 -d /etc/apt/keyrings
      - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      - chmod a+r /etc/apt/keyrings/docker.asc
      - 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
      - apt-get update
      - apt-get install -y docker-ce docker-ce-cli containerd.io git curl jq make
      - systemctl enable --now docker
      - usermod -aG docker airship

      # kind
      - curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
      - chmod +x /usr/local/bin/kind

      # kubectl
      - 'curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"'
      - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - rm kubectl

      # kustomize
      - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /usr/local/bin

      # Go (required to build airshipctl)
      - curl -Lo /tmp/go.tar.gz https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
      - tar -C /usr/local -xzf /tmp/go.tar.gz
      - rm /tmp/go.tar.gz
      - echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile.d/go.sh
      - echo 'export GOPATH=/home/airship/go' >> /etc/profile.d/go.sh
      - echo 'export PATH=$PATH:/home/airship/go/bin' >> /etc/profile.d/go.sh

      # airshipctl — check out the tag matching your target environment
      - git clone https://opendev.org/airship/airshipctl.git /home/airship/airshipctl
      - chown -R airship:airship /home/airship/airshipctl
      - su - airship -c 'cd /home/airship/airshipctl && PATH=$PATH:/usr/local/go/bin GOPATH=/home/airship/go make build'
      - install -m 0755 /home/airship/airshipctl/bin/airshipctl /usr/local/bin/airshipctl

      # airshipctl shell completion
      - airshipctl completion bash > /etc/bash_completion.d/airshipctl

      - chown -R airship:airship /home/airship/go /home/airship/airshipctl

      # Teleport node agent (SSH + kube). Config + placeholder kubeconfig were
      # already written by the cloud-init write_files block above; we just have
      # to install the binary and start the service. SSH is immediately usable
      # via `tsh ssh airship@airship-lab`; kubernetes_service will start with
      # zero clusters until /usr/local/bin/teleport-link-kubeconfig is run.
      - curl -sL https://cdn.teleport.dev/teleport_16.5.13_amd64.deb -o /tmp/teleport.deb
      - dpkg -i /tmp/teleport.deb
      - rm -f /tmp/teleport.deb
      - systemctl enable --now teleport

    final_message: "airship-lab ready after $UPTIME seconds"
