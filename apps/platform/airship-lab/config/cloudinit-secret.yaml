apiVersion: v1
kind: Secret
metadata:
  name: airship-lab-cloudinit
  namespace: airship-lab
type: Opaque
stringData:
  # Static network config for KubeVirt masquerade. The launcher pod's
  # internal bridge uses 10.0.2.0/24 with 10.0.2.1 as gateway; the guest
  # always lands at 10.0.2.2. Using static avoids any guest DHCP issue
  # (we hit a case where the guest never got a DHCP lease on Talos 1.9.6 /
  # KubeVirt 1.8.2, leaving cloud-init's network stage blocked).
  networkdata: |
    version: 2
    ethernets:
      eth0:
        match:
          name: "en*"
        addresses:
          - 10.0.2.2/24
        gateway4: 10.0.2.1
        nameservers:
          addresses: [1.1.1.1, 8.8.8.8]
  userdata: |
    #cloud-config
    users:
      - name: airship
        groups: [sudo, docker]
        shell: /bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        # Lab-only console password so virtctl console / serial login works
        # before SSH/network is up. Not a security concern in a private lab.
        lock_passwd: false
        plain_text_passwd: airship
        ssh_authorized_keys:
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDp7ZwTmqK2kSwWkspmxmiasjSTbidsIhEQtsxq9BBNF mattgolden@MacBookPro.madavigo.com"

    chpasswd:
      expire: false
    ssh_pwauth: true

    package_update: true
    package_upgrade: true

    runcmd:
      # Docker CE from Docker's official repo
      - install -m 0755 -d /etc/apt/keyrings
      - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      - chmod a+r /etc/apt/keyrings/docker.asc
      - 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list'
      - apt-get update
      - apt-get install -y docker-ce docker-ce-cli containerd.io git curl jq make
      - systemctl enable --now docker
      - usermod -aG docker airship

      # kind
      - curl -Lo /usr/local/bin/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
      - chmod +x /usr/local/bin/kind

      # kubectl
      - 'curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"'
      - install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      - rm kubectl

      # kustomize
      - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s -- /usr/local/bin

      # Go (required to build airshipctl)
      - curl -Lo /tmp/go.tar.gz https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
      - tar -C /usr/local -xzf /tmp/go.tar.gz
      - rm /tmp/go.tar.gz
      - echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile.d/go.sh
      - echo 'export GOPATH=/home/airship/go' >> /etc/profile.d/go.sh
      - echo 'export PATH=$PATH:/home/airship/go/bin' >> /etc/profile.d/go.sh

      # airshipctl — check out the tag matching your target environment
      - git clone https://opendev.org/airship/airshipctl.git /home/airship/airshipctl
      - chown -R airship:airship /home/airship/airshipctl
      - su - airship -c 'cd /home/airship/airshipctl && PATH=$PATH:/usr/local/go/bin GOPATH=/home/airship/go make build'
      - install -m 0755 /home/airship/airshipctl/bin/airshipctl /usr/local/bin/airshipctl

      # airshipctl shell completion
      - airshipctl completion bash > /etc/bash_completion.d/airshipctl

      - chown -R airship:airship /home/airship/go /home/airship/airshipctl

    final_message: "airship-lab ready after $UPTIME seconds"
