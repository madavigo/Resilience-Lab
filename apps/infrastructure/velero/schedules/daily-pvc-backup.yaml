apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-pvc-backup
  namespace: velero
  # No Helm or ArgoCD instance labels -- Backup CRs spawned at runtime are invisible to ArgoCD
spec:
  schedule: "0 2 * * *"
  useOwnerReferencesInBackup: false
  template:
    ttl: 336h
    includedNamespaces:
      - vault
      - authentik
      - observability
      - wiki
      - navidrome
      - lux
      - misterb
      - toothy
      - gitea-runner
      - media
      - argo-events
    defaultVolumesToFsBackup: true
