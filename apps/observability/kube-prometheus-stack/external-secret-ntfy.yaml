# Full ntfy webhook URL for the AlertManager critical-alert backstop.
#
# The topic is a secret (ntfy.sh topics are unauthenticated — secrecy of the
# topic name is the only access control), so the URL cannot live in git.
# ESO templates the fetched topic into a complete URL, and AlertManager reads
# it via `url_file` from the mounted secret.
#
# ?template=alertmanager is an ntfy built-in that renders the AlertManager
# JSON payload into a readable notification instead of a raw JSON blob.
#
# Priority note: the built-in template fixes priority at default (3); ntfy
# ignores ?priority=, ?p= and X-Priority when a named template is active
# (verified against ntfy.sh). Inline templating (?tpl=yes&t=..&m=..&p=4) does
# honour priority, but its Go template braces would collide with ESO's own
# {{ }} templating below and need escaping — not worth the fragility for a
# backstop. If high priority (DND bypass) is wanted later, self-host ntfy and
# override server/templates/alertmanager.yml instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-alertmanager-url
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: ntfy-alertmanager-url
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        url: "https://ntfy.sh/{{ .topic }}?template=alertmanager&tags=rotating_light"
  data:
    - secretKey: topic
      remoteRef:
        key: secret/resilience-lab/ntfy
        property: topic
